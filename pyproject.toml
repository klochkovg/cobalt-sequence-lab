[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt-sequence-lab"
version = "0.1.0"
description = "Sequence processing CLI experiments with Biopython"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["biopython>=1.83", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "pydantic>=2"]
parquet = ["pyarrow"]
rna = ["ViennaRNA>=2.6"]  # RNA folding (planned)
dev = [
    "cobalt-sequence-lab[serve,parquet,rna]",
    "pytest",
    "pytest-cov",
    "httpx2",  # required by fastapi.testclient
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cobalt = "cobalt.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
[[tool.mypy.overrides]]
# pyarrow and ViennaRNA (RNA) ship without type stubs
module = ["pyarrow", "pyarrow.*", "RNA", "RNA.*"]
ignore_missing_imports = true

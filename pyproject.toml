[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt-sequence-lab"
version = "0.1.0"
description = "Sequence processing CLI experiments with Biopython"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["biopython>=1.83"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "pydantic>=2"]
dev = [
    "cobalt-sequence-lab[serve]",
    "pytest",
    "pytest-cov",
    "httpx",  # required by fastapi.testclient
    "ruff",
    "mypy",
]

[project.scripts]
cobalt = "cobalt.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
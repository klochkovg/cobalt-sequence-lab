[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt-sequence-lab"
version = "0.1.0"
description = "Sequence processing CLI experiments with Biopython"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cobalt = "cobalt.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt-sequence-lab"
version = "0.2.0"
description = "Sequence processing CLI experiments with Biopython"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["biopython>=1.83", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
server = ["fastapi", "uvicorn[standard]", "pydantic>=2", "python-multipart"]
parquet = ["pyarrow"]
rna = ["ViennaRNA>=2.6"]  # RNA folding (planned)
dev = [
    "cobalt-sequence-lab[server,parquet,rna]",
    "pytest",
    "pytest-cov",
    "httpx2",  # required by fastapi.testclient
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cobalt = "cobalt.cli.main:main"
cobalt-server = "cobalt.server.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

# Package boundaries: cli and server both build on core, never on each other, and core imports
# neither. src/cobalt/cli/ruff.toml and src/cobalt/server/ruff.toml let each front-end import
# itself; tests may import anything.
[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cobalt.cli".msg = "only cobalt.cli may import the CLI; reach the server over HTTP"
"cobalt.server".msg = "only cobalt.server may import the server; share code through cobalt.core"

[tool.ruff.lint.per-file-ignores]
"src/cobalt/__main__.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[[tool.mypy.overrides]]
# pyarrow and ViennaRNA (RNA) ship without type stubs
module = ["pyarrow", "pyarrow.*", "RNA", "RNA.*"]
ignore_missing_imports = true
